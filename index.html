<section class="container home-hero">

    <!-- MAIN CONTENT -->
    <main>
      <div class="container recipes-big-container">
        <!-- LEFT COLUMN -->
        <div class="recipes-big-container-left">

  <button class="categories-btn">All Categories</button>
  <ul class="categories-list"></ul>
</section>

          <aside class="sidebar-populer">
  <div class="row">
    <h2 class="sidebar-populer-title">POPULAR RECIPES</h2>
    <ul class="recipe-list"></ul>
  </div>
</aside>

        </div>

        <!-- RIGHT COLUMN -->
        <div class="recipes-big-container-right">
          <!-- Recipes Filter Section -->
<div class="recipes-filter-container">
  <div class="filter-header">
    <h2>Filter Recipes</h2>
  </div>

  <form class="filter-form" id="filterForm">
    <!-- Search Bar -->
    <div class="filter-group">
      <label for="searchInput" class="filter-label">Search</label>
      <div class="search-input-wrapper">
        <input
          type="text"
          id="searchInput"
          class="filter-input search-input"
          placeholder="Search recipes..."
          aria-label="Search recipes by keyword"
        />
        <svg
          width="18"
          height="18"
          viewBox="0 0 18 18"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="search-icon"
        >
          <path
            d="M16.2826 15.2178L13.5001 12.4578C14.5801 11.1111 15.1032 9.40177 14.9617 7.68127C14.8201 5.96077 14.0248 4.35988 12.7392 3.20778C11.4536 2.05567 9.77541 1.43993 8.04974 1.48715C6.32408 1.53437 4.68209 2.24097 3.46141 3.46165C2.24072 4.68234 1.53412 6.32432 1.4869 8.04999C1.43968 9.77565 2.05543 11.4538 3.20753 12.7394C4.35964 14.025 5.96053 14.8204 7.68103 14.9619C9.40153 15.1034 11.1109 14.5804 12.4576 13.5003L15.2176 16.2603C15.2873 16.3306 15.3702 16.3864 15.4616 16.4245C15.553 16.4625 15.651 16.4821 15.7501 16.4821C15.8491 16.4821 15.9471 16.4625 16.0385 16.4245C16.1299 16.3864 16.2128 16.3306 16.2826 16.2603C16.4177 16.1204 16.4933 15.9335 16.4933 15.739C16.4933 15.5445 16.4177 15.3576 16.2826 15.2178ZM8.25005 13.5003C7.2117 13.5003 6.19667 13.1924 5.33331 12.6155C4.46995 12.0386 3.79704 11.2187 3.39968 10.2594C3.00232 9.30007 2.89836 8.24447 3.10093 7.22607C3.3035 6.20767 3.80351 5.27221 4.53774 4.53798C5.27197 3.80376 6.20743 3.30374 7.22583 3.10117C8.24423 2.8986 9.29983 3.00257 10.2591 3.39993C11.2185 3.79729 12.0384 4.47019 12.6153 5.33355C13.1921 6.19691 13.5001 7.21194 13.5001 8.25029C13.5001 9.64268 12.9469 10.978 11.9624 11.9626C10.9778 12.9472 9.64244 13.5003 8.25005 13.5003Z"
          />
        </svg>
      </div>
    </div>

    <!-- Time Filter -->
    <div class="filter-group">
      <label for="timeSelect" class="filter-label">Time</label>
      <select
        id="timeSelect"
        class="filter-select"
        aria-label="Select time range"
      >
        <option value="" disabled>40 min</option>
        <option value="10">10 min</option>
        <option value="20">20 min</option>
        <option value="30">30 min</option>
        <option value="40">40 min</option>
        <option value="50">50 min</option>
        <option value="60">60 min</option>
      </select>
    </div>

    <!-- Area/Region Filter -->
    <div class="filter-group">
      <label for="areaSelect" class="filter-label">Area</label>
      <select
        id="areaSelect"
        class="filter-select"
        aria-label="Select cuisine area"
      >
        <option value="" disabled>Italian</option>
        <!-- Options will be populated by JavaScript -->
      </select>
    </div>

    <!-- Ingredients Filter -->
    <div class="filter-group">
      <label for="ingredientSelect" class="filter-label">Ingredients</label>
      <select
        id="ingredientSelect"
        class="filter-select"
        aria-label="Select ingredient"
      >
        <option value="" disabled>Tomato</option>
        <!-- Options will be populated by JavaScript -->
      </select>
    </div>
  </form>
  <!-- Reset Button -->
  <button type="reset" form="filterForm" class="filter-reset-btn">
    <svg
      width="10"
      height="10"
      viewBox="0 0 10 10"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M0.75 0.75L8.75 8.75"
        stroke="#9BB537"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M8.75 0.75L0.75 8.75"
        stroke="#9BB537"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    Reset the filter
  </button>
</div>
